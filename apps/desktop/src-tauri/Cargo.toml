[package]
name = "maxian-desktop"
version = "0.2.29"
description = "码弦 Maxian 桌面客户端"
edition = "2021"
rust-version = "1.77"

[lib]
name = "maxian_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-http = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-fs = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
base64 = "0.22"
sysinfo = "0.32"

# 终端 PTY：Tauri 侧直接管 PTY，绕开 Bun runtime 在 @lydell/node-pty 上的子进程 bug。
# portable-pty 是 wezterm 项目的 PTY 抽象层，跨平台（macOS / Linux / Windows ConPTY）。
portable-pty = "0.8"
parking_lot = "0.12"

[features]
custom-protocol = ["tauri/custom-protocol"]

# 发布构建优化：去符号 + LTO，减小体积、提高反编译门槛、略微加快启动
[profile.release]
strip = true        # 去除调试符号（更难逆向、体积更小）
lto = "thin"        # 链接时优化
codegen-units = 1   # 更充分的优化（编译稍慢，产物更优）
